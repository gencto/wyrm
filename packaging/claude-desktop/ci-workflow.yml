# Copy to .github/workflows/claude-desktop.yml (a session without the GitHub `workflow` scope cannot add it).
# The Claude Desktop extension of wyrm-mcp (ADR 0041): one .mcpb per platform, as artifacts.
name: claude-desktop
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "tools/wyrm-mcp/**"
      - "crates/wyrm-gateway-client/**"
      - "packaging/claude-desktop/**"
      - ".github/workflows/claude-desktop.yml"
permissions:
  contents: read
jobs:
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: "--universal", python: python3 }
          - { os: windows-latest, args: "", python: python }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - name: build
        shell: bash
        env: { PYTHON: "${{ matrix.python }}" }
        run: packaging/claude-desktop/build.sh ${{ matrix.args }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyrm-mcpb-${{ matrix.os }}
          path: dist/claude-desktop/*.mcpb
