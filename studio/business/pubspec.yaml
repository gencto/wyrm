name: business
description: The business package.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  archive: ^4.6.0
  async_redux: ^29.2.3
  connectivity_plus: ^7.3.2
  crypto: ^3.0.0
  fast_immutable_collections: ^12.0.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  logging: ^1.3.0
  material_ui: ^1.11.0
  models:
    path: ../models
  storage:
    path: ../storage
  # The broker protocol: gateway login, WebSocket CBOR frames, reconnects
  # (ADR 0009, 0037). Outside this workspace, so dart/ keeps its own CI.
  wyrm_client:
    path: ../../dart/wyrm_client

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.15.2
  pro_lints: ^6.2.0
