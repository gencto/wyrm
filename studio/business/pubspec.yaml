name: business
description: The business package.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  async_redux: ^28.4.0
  connectivity_plus: ^7.1.1
  fast_immutable_collections: ^11.2.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  freezed_annotation: ^3.1.0
  logging: ^1.3.0
  models:
    path: ../models
  storage:
    path: ../storage
  # The broker protocol: gateway login, WebSocket CBOR frames, reconnects
  # (ADR 0009, 0037). Outside this workspace, so dart/ keeps its own CI.
  wyrm_client:
    path: ../../dart/wyrm_client

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  pro_lints: ^6.1.0
