<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WYRM Studio — error dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0E1113}
code{font-family:'IBM Plex Mono',ui-monospace,monospace}
a{color:#F3A766}a:hover{color:#F6C59A}
</style>
</helmet>
<div style="position: relative; min-height: 900px; background: #0E1113; color: #ECE9E1; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; overflow: hidden">

<!-- The screen underneath (Flows), dimmed -->
<div aria-hidden="true" style="display: flex; flex-direction: column; min-height: 900px">
<div style="height: 48px; border-bottom: 1px solid #252B30; background: #13171A; display: flex; align-items: center; gap: 12px; padding: 0 16px">
<span style="width: 22px; height: 22px; border-radius: 6px; background: #2A1F16"></span>
<span style="font-weight: 600">WYRM Studio</span><span style="color: #8E979C">plant</span>
<span style="margin-left: auto; width: 120px; height: 10px; border-radius: 5px; background: #22282D"></span>
<span style="width: 28px; height: 28px; border-radius: 14px; background: #22282D"></span>
</div>
<div style="flex: 1; display: flex">
<div style="width: 64px; border-right: 1px solid #252B30; background: #13171A; display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 16px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: #22282D"></span><span style="width: 28px; height: 28px; border-radius: 8px; background: #2A1F16"></span><span style="width: 28px; height: 28px; border-radius: 8px; background: #22282D"></span><span style="width: 28px; height: 28px; border-radius: 8px; background: #22282D"></span><span style="width: 28px; height: 28px; border-radius: 8px; background: #22282D"></span>
</div>
<div style="flex: 1; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 24px; font-weight: 600">Dataflows</span>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px">
<span style="height: 120px; border-radius: 10px; border: 1px solid #252B30; background: #13171A"></span><span style="height: 120px; border-radius: 10px; border: 1px solid #252B30; background: #13171A"></span><span style="height: 120px; border-radius: 10px; border: 1px solid #252B30; background: #13171A"></span>
</div>
<span style="height: 360px; border-radius: 10px; border: 1px solid #252B30; background: #13171A"></span>
</div>
</div>
</div>

<!-- Scrim -->
<div style="position: absolute; inset: 0; background: rgba(6, 8, 9, 0.66); display: flex; align-items: center; justify-content: center; padding: 24px">

<section role="alertdialog" aria-modal="true" aria-labelledby="err-title" aria-describedby="err-body" style="width: 100%; max-width: 520px; border-radius: 14px; border: 1px solid #2F373D; background: #161A1D; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55); display: flex; flex-direction: column">

<div style="padding: 22px 24px 0; display: flex; gap: 14px; align-items: flex-start">
<span style="flex: none; width: 40px; height: 40px; border-radius: 10px; background: {{k.toneBg}}; color: {{k.tone}}; display: grid; place-items: center">
<sc-if value="{{k.iRights}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></sc-if>
<sc-if value="{{k.iReach}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 16a5 5 0 0 1 7 0"></path><path d="M12 19.5h.01"></path><path d="M3 3l18 18"></path></svg></sc-if>
<sc-if value="{{k.iInput}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg></sc-if>
<sc-if value="{{k.iBusy}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l3 2"></path><path d="M9 2h6"></path></svg></sc-if>
<sc-if value="{{k.iGone}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path><path d="M8.5 11h5"></path></svg></sc-if>
<sc-if value="{{k.iBroker}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"></rect><rect x="3" y="13" width="18" height="7" rx="2"></rect><path d="M7 7.5h.01M7 16.5h.01"></path><path d="M14 15l3 3M17 15l-3 3"></path></svg></sc-if>
<sc-if value="{{k.iStudio}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 8h18"></path><path d="M12 12v3M12 18h.01"></path></svg></sc-if>
</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h2 id="err-title" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 1.35">{{k.title}}</h2>
<code style="font-size: 12px; color: #8E979C; overflow-wrap: anywhere">{{k.where}}</code>
</div>
<button type="button" aria-label="Close" style="flex: none; width: 32px; height: 32px; margin: -4px -8px 0 0; border: 0; border-radius: 8px; background: transparent; color: #8E979C; cursor: pointer; display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div id="err-body" style="padding: 16px 24px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #8E979C">{{k.saidBy}}</span>
<p style="margin: 0; padding: 12px 14px; border-radius: 8px; background: #0E1113; border: 1px solid #22282D; font-size: 14px; line-height: 1.55; color: #ECE9E1">{{k.said}}</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #8E979C">What you can do</span>
<sc-for list="{{k.todo}}" as="t" hint-placeholder-count="2">
<span style="display: flex; gap: 10px; font-size: 14px; line-height: 1.5; color: #C5CBCE"><span style="flex: none; width: 5px; height: 5px; margin-top: 9px; border-radius: 50%; background: {{k.tone}}"></span>{{t}}</span>
</sc-for>
</div>
<sc-if value="{{k.hasNote}}" hint-placeholder-val="{{false}}">
<div style="display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #2E2814; border: 1px solid #4A4020; font-size: 13px; line-height: 1.5; color: #E2C15A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg><span>{{k.note}}</span></div>
</sc-if>

<div style="border-top: 1px solid #22282D; padding-top: 6px">
<button type="button" aria-expanded="{{detailsAria}}" onClick="{{toggle}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0; border: 0; background: transparent; color: #A3ABAF; font: inherit; font-size: 13px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate({{chev}}deg)"><path d="M9 6l6 6-6 6"></path></svg>Details
<code style="font-size: 11px; padding: 2px 6px; border-radius: 4px; background: {{k.toneBg}}; color: {{k.tone}}">{{k.code}}</code>
</button>
<sc-if value="{{showDetails}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; padding: 4px 0 6px 22px; font-size: 12px">
<sc-for list="{{k.details}}" as="d" hint-placeholder-count="6">
<span style="color: #8E979C">{{d.l}}</span><code style="color: #C5CBCE; overflow-wrap: anywhere">{{d.v}}</code>
</sc-for>
</div>
</sc-if>
</div>
</div>

<div style="padding: 14px 24px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" style="margin-right: auto; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; color: #A3ABAF; font: inherit; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>{{k.copy}}</button>
<sc-if value="{{k.hasSecondary}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #3A4249; background: transparent; color: #ECE9E1; font: inherit; font-size: 14px; cursor: pointer">{{k.secondary}}</button>
</sc-if>
<button type="button" aria-disabled="{{k.ariaDis}}" style="height: 40px; padding: 0 18px; border-radius: 8px; border: 0; background: {{k.primaryBg}}; color: {{k.primaryFg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{k.primary}}</button>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","default":"rights","options":["rights","reach","input","busy","gone","broker","studio"]},"details":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#E8893A"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const kind = this.props.kind ?? 'rights';
    const accent = this.props.accent ?? '#E8893A';
    const open = st.open ?? this.props.details ?? false;
    const TONE = {
      warn: ['#E2C15A', '#2E2814'], bad: ['#E07A5F', '#33201B'], info: ['#A3ABAF', '#22282D'], accent: ['#F3A766', '#2A1F16']
    };
    const base = (tone) => ({ tone: TONE[tone][0], toneBg: TONE[tone][1] });
    const when = '2026-11-10 11:52:04 (local)';
    const K = {
      rights: { ...base('warn'), icon: 'Rights',
        title: 'You can’t deploy pump-control',
        where: 'wy/plant/dataflows/pump-control › deploy',
        saidBy: 'The broker said', said: 'Deploying needs config on dataflows/pump-control. Your role operator has write there.',
        todo: ['Ask an administrator for config on dataflows, or ask one to deploy it.', 'Your edits stay in the editor; nothing was sent to the plant.'],
        code: 'permission_denied', primary: 'OK', secondary: 'See my access', copy: 'Copy details' },
      reach: { ...base('warn'), icon: 'Reach',
        title: 'edge did not answer',
        where: 'wy/edge/downstream/modbus/plc1/t2 › set',
        saidBy: 'Studio waited 10 s', said: 'No answer from the broker at edge. The link to it is up, so the broker or the device behind it is slow.',
        todo: ['Try again; if it keeps timing out, look at the link’s status in Links.'],
        note: 'A write that timed out may still have been applied. Check the value before you send it again.',
        code: 'timeout', primary: 'Try again', secondary: 'Close', copy: 'Copy details' },
      input: { ...base('accent'), icon: 'Input',
        title: 'The broker refused these parameters',
        where: 'wy/plant/downstream/modbus/plc1 › edit',
        saidBy: 'The broker said', said: 'poll_rate: 0 is below the minimum of 100 ms.',
        todo: ['Back in the form, the field is marked; correct it and save again.'],
        code: 'invalid_parameter', primary: 'Back to the form', secondary: null, copy: 'Copy details' },
      busy: { ...base('info'), icon: 'Busy',
        title: 'plant is busy, the install did not start',
        where: 'wy/plant/sys/links › install_repo',
        saidBy: 'The broker said', said: 'An access-control rebuild is in progress; new installs are refused until the router is back.',
        todo: ['Studio can try again by itself when the broker is ready.'],
        code: 'busy', primary: 'Try again in 4 s', primaryDisabled: true, secondary: 'Close', copy: 'Copy details' },
      gone: { ...base('info'), icon: 'Gone',
        title: 'pump-control is not there anymore',
        where: 'wy/plant/dataflows/pump-control › get_def',
        saidBy: 'The broker said', said: 'No node at dataflows/pump-control.',
        todo: ['Someone removed or renamed it after this screen loaded. Refresh to see what is there now.'],
        code: 'not_found', primary: 'Refresh', secondary: 'Close', copy: 'Copy details' },
      broker: { ...base('bad'), icon: 'Broker',
        title: 'Installing modbus 0.4.2 failed on plant',
        where: 'wy/plant/sys/links › install_repo',
        saidBy: 'The broker said', said: 'unpack modbus-0.4.2.zip: wyrm-link.json: wyrm_link 3 is newer than this broker (2).',
        todo: ['Install a version built for this broker, or update wyrmd on plant.', 'The broker log around 11:52 has the rest of the story.'],
        code: 'internal_error', primary: 'Open the log', secondary: 'Close', copy: 'Copy details' },
      studio: { ...base('bad'), icon: 'Studio',
        title: 'Studio could not open this flow',
        where: 'Flow editor › open pump-control',
        saidBy: 'What happened', said: 'Studio could not read the saved layout of this flow. This is a fault in Studio, not on the broker; nothing was sent.',
        todo: ['Open the flow again; Studio lays it out afresh if the layout stays unreadable.', 'Copy the report and send it to us: it holds no values or passwords.'],
        code: 'studio · FormatException', primary: 'OK', secondary: null, copy: 'Copy report' }
    };
    const k = K[kind] || K.rights;
    const details = kind === 'studio'
      ? [ { l: 'Error', v: 'FormatException: Unexpected character (at offset 412)' }, { l: 'In', v: 'flow_layout_mapper.dart › decode' }, { l: 'Screen', v: 'Flow editor' }, { l: 'Studio', v: '0.3.0 (macOS 15.1)' }, { l: 'Time', v: when }, { l: 'Report', v: 'the stack trace is in the copied report only' } ]
      : [ { l: 'Status', v: `${k.code} (0x${({permission_denied:'21',timeout:'28',invalid_parameter:'23',busy:'24',not_found:'27',internal_error:'25'})[k.code]})` }, { l: 'Call', v: k.where.split(' › ')[1] + ' on ' + k.where.split(' › ')[0] }, { l: 'Site', v: k.where.split('/')[1] }, { l: 'As', v: 'olena (operator)' }, { l: 'Gateway', v: 'https://plant.local:8445' }, { l: 'Time', v: when } ];
    const flags = ['Rights','Reach','Input','Busy','Gone','Broker','Studio'];
    const ic = {}; flags.forEach((f) => { ic['i' + f] = k.icon === f; });
    const dis = !!k.primaryDisabled;
    return {
      k: { ...k, ...ic, details, hasNote: !!k.note, hasSecondary: !!k.secondary,
        ariaDis: dis ? 'true' : 'false', primaryBg: dis ? '#22282D' : accent, primaryFg: dis ? '#8E979C' : '#0E1113' },
      showDetails: open, detailsAria: open ? 'true' : 'false', chev: open ? 90 : 0,
      toggle: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
