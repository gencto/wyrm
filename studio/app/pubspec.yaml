name: app
description: The App project.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  async_redux: ^30.0.0
  auto_route: ^11.2.0
  business:
    path: ../business
  cupertino_ui: ^1.1.7
  # Declared here too so the app registers the plugin's platform code.
  device_key:
    path: ../device_key
  equatable: ^3.0.0
  fast_immutable_collections: ^12.0.1
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  localization:
    path: ../localization
  material_ui: ^1.11.1
  models:
    path: ../models
  pro_pretty_logging: ^2.0.0
  pro_validator: ^3.0.0
  screen_retriever: ^0.4.0
  ui:
    path: ../ui
  url_launcher: ^6.3.3
  window_manager: ^0.7.0
  # The gateway's typed records and closed sets (GatewayDevice,
  # DevicePlatform, …): the domain the mappers in lib/mappers/ map from,
  # and the client's own refusals in the error tests.
  wyrm_client:
    path: ../../dart/wyrm_client

dev_dependencies:
  # The Add a link tests build package zips and link backups.
  archive: ^4.7.1
  auto_route_generator: ^10.6.0
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  pro_lints: ^6.2.0
  # The error tests build a store over in-memory storage.
  storage:
    path: ../storage
  # The log-in tests open the settings link through a fake launcher.
  url_launcher_platform_interface: ^2.3.2

flutter:
  uses-material-design: true

  # assets:
    # BASE_URL="http://localhost:8080"
    # - .env
