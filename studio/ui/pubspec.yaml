name: ui
description: The UI package.
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  equatable: ^2.1.0
  extended_image: ^10.0.1
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_lucide: ^1.11.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  localization:
    path: ../localization
  theme_extensions_builder_annotation: ^7.4.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.14.1
  flutter_test:
    sdk: flutter
  pro_lints: ^6.1.0
  theme_extensions_builder: ^7.4.0

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
  assets:
    outputs:
      package_parameter_enabled: true

flutter:
  assets:
    - assets/svg/placeholders/
    # WYRM Studio icons, exported from the design canvas (docs/studio.md §6).
    # 24×24, stroke = currentColor: tint them with ColorFilter.
    - assets/svg/icons/
  # Board *Design system* §03. Bundled: edge machines are often offline.
  # OFL 1.1 (assets/fonts/OFL-*.txt).
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded.ttf
