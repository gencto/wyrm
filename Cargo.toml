[workspace]
resolver = "2"
members = ["crates/wyrm-core", "crates/wyrm-link-sdk", "links/mock", "crates/wyrm-client", "crates/wyrmd", "tools/wyr", "links/modbus", "crates/wyrm-state", "crates/wyrm-history", "crates/wyrm-storage", "crates/wyrm-admin", "crates/wyrm-link-sdk-derive", "crates/wyrm-flow", "crates/wyrm-gateway", "crates/wyrm-gateway-client", "links/mqtt", "links/probe", "crates/wyrm-wasm-host", "crates/wyrm-ffi", "tools/wyrm-mcp", "links/agent", "links/wasm", "examples/links/responder", "examples/links/requester", "examples/links/both", "examples/links/portable", "crates/wyrm-link-api", "crates/wyrm-link-portable", "crates/wyrm-link-guest", "crates/wyrm-schedule", "links/scheduler", "links/bacnet"]
exclude = ["crates/wyrm-link-guest/tests/fixture", "links/wasm/tests/app_fixture"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/gencto/wyrm"
authors = ["Mykhailo <info@gencto.uk>"]

[workspace.dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
minicbor = { version = "0.26", features = ["derive", "std", "half"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
wyrm-core = { path = "crates/wyrm-core" }
wyrm-link-sdk = { path = "crates/wyrm-link-sdk" }
wyrm-link-api = { path = "crates/wyrm-link-api" }
wyrm-link-portable = { path = "crates/wyrm-link-portable" }
wyrm-link-guest = { path = "crates/wyrm-link-guest" }
wyrm-schedule = { path = "crates/wyrm-schedule" }
wyrm-link-scheduler = { path = "links/scheduler" }
# Civil date-times and the bundled tz database; no OS clock or zone (wasm32 builds).
jiff = { version = "0.2.38", default-features = false }
# Guest bindings of `wyrm:app/app` (ADR 0023): sync exports only, no async runtime.
wit-bindgen = { version = "=0.57.1", default-features = false, features = ["macros", "realloc"] }
# Pinned exactly; upgrade quarterly together with the fixture suite.
zenoh = { version = "=1.10.1", default-features = false }
tokio = { version = "1", default-features = false }
ed25519-dalek = "2"
tracing = "0.1"
zeroize = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wyrm-link-mock = { path = "links/mock" }
wyrm-client = { path = "crates/wyrm-client" }
futures-core = "0.3"
json5 = "0.4"
getrandom = "0.3"
crc32c = "0.6"
hmac = "0.12"
sha2 = "0.10"
postcard = { version = "1", features = ["use-std"] }
argon2 = "0.5"
flate2 = "1"
rcgen = { version = "0.14", features = ["x509-parser"] }
x509-parser = "0.18"
# Link packages (ADR 0011): read only, deflate through flate2.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2"] }
ring = "0.17"
wyrm-state = { path = "crates/wyrm-state" }
wyrm-history = { path = "crates/wyrm-history" }
wyrm-storage = { path = "crates/wyrm-storage" }
wyrm-gateway-client = { path = "crates/wyrm-gateway-client" }
wyrm-link-probe = { path = "links/probe" }
# Embedded historian store (ADR 0014): pure Rust, one file per day.
redb = "~4.1"
wyrm-flow = { path = "crates/wyrm-flow" }
rhai = { version = "1.26", features = ["sync"] }
wyrm-admin = { path = "crates/wyrm-admin" }
nix = { version = "0.29", features = ["signal"] }
tokio-modbus = { version = "0.17", default-features = false }
wyrm-link-modbus = { path = "links/modbus" }
zenoh-plugin-storage-manager = { version = "=1.10.1", default-features = false }
zenoh-ext = { version = "=1.10.1", default-features = false, features = ["unstable"] }
zenoh-plugin-rest = { version = "=1.10.1", default-features = false, features = ["static_plugin"] }
axum = { version = "0.8.9", default-features = false }
axum-server = { version = "0.8", default-features = false }
# ring only: the rustls defaults pull in aws-lc.
#
# Pinned to 0.23.45. zenoh-link-tls 1.10.1 (and zenoh main as of 2026-10-29) gives
# the reader and the writer task one `&mut TlsStream` each through an `UnsafeCell`.
# rustls 0.23.46 reads `core.state` on every write (`check_error`), while every read
# swaps that field (`process_new_packets`). The writer then sees "handshake not
# complete" (the TLS link drops; messages in flight are lost) or a torn value (SIGBUS
# in `check_error`). In 0.23.45 the two tasks meet only on rare paths (KeyUpdate,
# queued alerts); the aliasing itself stays upstream's bug. The four 0.23.46
# advisories (RUSTSEC-2026-0346..0349) do not apply to this feature set: brotli
# certificate decompression is off; ring has no post-quantum key share to strip; no
# ECH; nothing formats session values with `Debug`. Lift the pin when Zenoh fixes the
# TLS link, or when process links move off `tls/`.
rustls = { version = "=0.23.45", default-features = false }
rustls-pki-types = "1.9"
base64 = "0.22"
tokio-tungstenite = "0.29"
tokio-rustls = { version = "0.26", default-features = false }
futures-util = { version = "0.3", default-features = false }
wyrm-gateway = { path = "crates/wyrm-gateway" }
# MQTT: rustls without a provider (ring is chosen in code; never aws-lc).
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls-native-certs = "0.8"
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
rumqttd = { version = "0.20", default-features = false }
wyrm-link-mqtt = { path = "links/mqtt" }
wyrm-link-bacnet = { path = "links/bacnet" }
wyrm-link-agent = { path = "links/agent" }
# WASM host: no defaults (no cache, wasi, async, gc, profiling); MSRV 1.89 → 40.x.
wasmtime = { version = "=40.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
wat = "1"
wasmparser = { version = "0.243", default-features = false, features = ["std"] }
wit-component = { version = "=0.243.0", default-features = false }
wyrm-wasm-host = { path = "crates/wyrm-wasm-host" }
wyrm-link-wasm = { path = "links/wasm" }
wyrm-example-portable = { path = "examples/links/portable" }
# MCP (ADR 0005): server side only; no reqwest/auth features (no aws-lc).
rmcp = { version = "=3.6.0", default-features = false }
schemars = "1"
wyrm-mcp = { path = "tools/wyrm-mcp", default-features = false }
# LLM client of links/agent: plain hyper over tokio-rustls (ring provider).
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
bytes = "1"
webpki-roots = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds (tests, CI) compile WASM components with cranelift: unoptimized
# it takes seconds per component, and installs time out on slow hosts.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
