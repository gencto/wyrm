[package]
name = "wyrm-storage"
description = "WYRM broker storage: wy/<site>/storage, nodes and values people create, kept across restarts (ADR 0017)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
redb.workspace = true
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
serde_json.workspace = true
hex.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wyrm-link-sdk = { workspace = true, features = ["harness"] }
