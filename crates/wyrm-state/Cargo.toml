[package]
name = "wyrm-state"
description = "WYRM control-plane state: WAL (CBOR, CRC32C per record, HMAC chain) + postcard snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `Store::with_probe`: tests fail a step of an append, or look at the files between two steps
testkit = []

[dependencies]
# `mac::hmac_sha256`: the WAL chain and snapshot MACs
wyrm-core.workspace = true
minicbor.workspace = true
serde.workspace = true
postcard.workspace = true
crc32c.workspace = true
hmac.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
wyrm-state = { path = ".", features = ["testkit"] }
crc32c.workspace = true

[lints]
workspace = true
