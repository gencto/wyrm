[package]
name = "wyrm-wasm-host"
description = "WYRM WASM host: wasmtime components for flow nodes and point drivers, with fuel, memory and time limits and no WASI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wasmtime.workspace = true
sha2.workspace = true
wyrm-link-api.workspace = true
wyrm-core.workspace = true
minicbor.workspace = true
wasmparser = { workspace = true, features = ["component-model"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
wat.workspace = true
# dummy components of both `wyrm:app` versions (ADR 0025 back-compat test)
wit-component = { workspace = true, features = ["dummy-module"] }
wit-parser = "=0.243.0"
