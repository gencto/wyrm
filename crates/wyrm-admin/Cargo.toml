[package]
name = "wyrm-admin"
description = "WYRM control plane: link registry, tokens, internal CA, ACL generation, supervisor, quarantine, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# `release::testkit`: archives of any shape for the update tests of `wyrmd`;
# `Control::audit_lsn` and `Control::historian` for its perf tests (tests/perf.rs)
testkit = []

[dependencies]
wyrm-core = { workspace = true, features = ["ring"] }
wyrm-state.workspace = true
wyrm-storage.workspace = true
wyrm-history.workspace = true
wyrm-client.workspace = true
wyrm-link-sdk = { workspace = true, features = ["package"] }
wyrm-wasm-host.workspace = true
zenoh = { workspace = true, features = ["unstable"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "fs", "net", "io-util"] }
minicbor.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
argon2.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
zip.workspace = true
# Package downloads (ADR 0011): HTTPS over tokio-rustls with the ring provider.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types.workspace = true
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
webpki-roots.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
bytes.workspace = true
ring.workspace = true
# `eckey`: a key as a PKCS#8 PEM block
base64.workspace = true
flate2.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource", "fs"] }
rustix.workspace = true

[dev-dependencies]
wat.workspace = true
# `harness`: the admin as a link in a test session (the `sys` action schemas)
wyrm-link-sdk = { workspace = true, features = ["package", "harness"] }
# the registry snapshot's layout (an older store opens unchanged)
postcard.workspace = true
# `test-util`: paused time for the peers' `connected` probes
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[lints]
workspace = true
