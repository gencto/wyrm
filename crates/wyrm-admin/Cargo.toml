[package]
name = "wyrm-admin"
description = "WYRM control plane: link registry, tokens, internal CA, ACL generation, supervisor, quarantine, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wyrm-core.workspace = true
wyrm-state.workspace = true
wyrm-history.workspace = true
wyrm-client.workspace = true
wyrm-link-sdk = { workspace = true, features = ["package"] }
wyrm-wasm-host.workspace = true
zenoh = { workspace = true, features = ["unstable"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "process", "fs", "net", "io-util"] }
minicbor.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
hex.workspace = true
getrandom.workspace = true
argon2.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
zip.workspace = true
# Package downloads (ADR 0011): HTTPS over tokio-rustls with the ring provider.
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types.workspace = true
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
webpki-roots.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
bytes.workspace = true
sha2.workspace = true
ring.workspace = true
flate2.workspace = true
ed25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource", "fs"] }

[dev-dependencies]
wat.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
