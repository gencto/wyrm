[package]
name = "wyrm-link-portable"
description = "WYRM portable link runtime: runs an App (wyrm-link-api) as a link with a command buffer, a sealed store, timers, subscriptions and restarts (ADR 0023)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wyrm-core.workspace = true
wyrm-link-api.workspace = true
wyrm-link-sdk.workspace = true
wyrm-client.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
zeroize.workspace = true
# tls_connect (ADR 0026): ring only, never aws-lc; the host's CA certificates
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
rustls-native-certs.workspace = true
# random_bytes (ADR 0030): the OS source
getrandom.workspace = true

[dev-dependencies]
rcgen.workspace = true
wyrm-link-sdk = { workspace = true, features = ["harness", "package"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
ed25519-dalek.workspace = true
# benches/roundtrip.rs: the reference app, natively and as a component
wyrm-example-portable.workspace = true
wyrm-wasm-host.workspace = true
wit-component.workspace = true

[[bench]]
name = "roundtrip"
harness = false
