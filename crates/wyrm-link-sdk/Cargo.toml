[package]
name = "wyrm-link-sdk"
description = "WYRM connector SDK: trait Link, LinkCtx, NodeTree, single-queryable responder, ptok checks, TestHarness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# In-memory Zenoh runtime + test signing key for driver tests. Never enable in production builds.
harness = []
# DSA QoS 2/3: nodes with `cfg.qos >= 2` publish through a zenoh-ext
# AdvancedPublisher (cache + miss detection) for late/recovering subscribers.
advanced = ["dep:zenoh-ext"]
# Process mode host: `process::run::<L>()` (mTLS client, hello, signals).
process = ["tokio/signal", "tokio/rt-multi-thread", "zenoh/transport_tls", "zenoh/transport_tcp", "dep:tracing-subscriber"]
# Link packages (ADR 0021): manifest, repository index, zip writer; for the
# broker and `wyr`, not for links.
package = ["dep:serde", "dep:zip", "dep:hex"]

[dependencies]
wyrm-core.workspace = true
zenoh.workspace = true
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
ed25519-dalek.workspace = true
minicbor.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true
sha2.workspace = true
# Branch export/import text (ruling 11), like the storage export (ADR 0017).
serde_json.workspace = true
ring.workspace = true
zenoh-ext = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
wyrm-link-sdk-derive = { path = "../wyrm-link-sdk-derive" }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource", "process"] }

[dev-dependencies]
wyrm-link-sdk = { path = ".", features = ["harness", "advanced", "process"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
