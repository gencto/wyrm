[package]
name = "wyrmd"
description = "WYRM broker: Zenoh router + static plugins + embedded connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Builds `wyrmd_next`, a second broker binary that says it is a later
# version: only for the tests of the broker's own update (ADR 0048 §2).
# The dev-dependency on this crate below turns it on for `cargo test`; a
# build of `wyrmd` itself never has it.
test-next = []

[[bin]]
name = "wyrmd_next"
path = "src/bin/wyrmd_next.rs"
required-features = ["test-next"]

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk = { workspace = true, features = ["advanced", "process"] }
wyrm-admin.workspace = true
wyrm-state.workspace = true
wyrm-flow.workspace = true
wyrm-storage.workspace = true
wyrm-history.workspace = true
wyrm-gateway.workspace = true
zeroize.workspace = true
wyrm-link-mock.workspace = true
wyrm-link-wasm.workspace = true
wyrm-link-modbus.workspace = true
wyrm-link-s7.workspace = true
wyrm-link-agent.workspace = true
wyrm-link-mqtt.workspace = true
wyrm-link-http.workspace = true
wyrm-link-snmp.workspace = true
wyrm-link-bacnet.workspace = true
wyrm-link-opcua.workspace = true
wyrm-link-prometheus.workspace = true
wyrm-filestore.workspace = true
wyrm-link-s3.workspace = true
wyrm-link-gdrive.workspace = true
wyrm-link-webdav.workspace = true
wyrm-link-localfs.workspace = true
wyrm-link-portable.workspace = true
# the portable example app (ADR 0023): driver `portable-echo`
wyrm-example-portable.workspace = true
# the embedded scheduler (ADR 0022) at `downstream/scheduler`
wyrm-link-scheduler.workspace = true
wyrm-link-dql.workspace = true
# the embedded alarm link (ADR 0034) at `downstream/alarm`
wyrm-link-alarm.workspace = true
# the embedded uplink (ADR 0035) at `downstream/uplink`
wyrm-link-uplink.workspace = true
wyrm-link-api.workspace = true
# the system zone for the scheduler's `default_tz` (ruling 3)
jiff = { workspace = true, features = ["std", "tz-system"] }
# Static plugins need the internal runtime API; this crate is the only one
# that enables `internal`/`plugins`/`unstable`.
zenoh = { workspace = true, features = ["internal", "plugins", "unstable", "stats", "transport_tcp", "transport_tls", "transport_quic", "transport_unixsock-stream"] }
zenoh-plugin-storage-manager.workspace = true
zenoh-plugin-rest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "net", "io-util"] }
# the lease arbiter of a standby pair (ADR 0036): TLS over TCP, ring only
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
x509-parser.workspace = true
# the gateway's DNS-SD announce (ADR 0050 §2.1)
mdns-sd.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
wyrm-client.workspace = true
json5.workspace = true
clap.workspace = true
hex.workspace = true
# release tooling and the update of the broker itself (ADR 0048 §2)
flate2.workspace = true
ed25519-dalek.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# the feature for the tests' second binary (see `[features]`)
wyrmd = { path = ".", features = ["test-next"] }
wyrm-link-modbus = { workspace = true, features = ["sim"] }
wyrm-link-probe.workspace = true
wyrm-gateway-client.workspace = true
wyrm-client.workspace = true
ed25519-dalek.workspace = true
zip = { workspace = true, features = ["deflate-flate2"] }
sha2.workspace = true
minicbor.workspace = true
wat.workspace = true
wit-component.workspace = true
wyrm-link-sdk = { workspace = true, features = ["package"] }
# a TLS server for an installed app's `tls` action (ADR 0030): ring only, never aws-lc
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
rcgen.workspace = true
wyrm-wasm-host.workspace = true
