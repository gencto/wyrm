include: package:lints/recommended.yaml

# Strict: these packages are the one typed decode boundary for every Dart
# client (Studio rule 8). No implicit dynamic, no unchecked casts.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.freezed.dart"
    - "**/*.g.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cast_nullable_to_non_nullable
    - exhaustive_cases
    - prefer_final_fields
    - type_annotate_public_apis
    - unawaited_futures
