name: wyrm_flutter
description: Flutter widgets for WYRM — a lazy node tree with live values over any WyrmApi (gateway or FFI).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  wyrm_client:
    path: ../wyrm_client
  # `editor: file` params (spec 02 0.1.7): macOS, Windows, Linux, web.
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
