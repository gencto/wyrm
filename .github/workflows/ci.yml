name: ci
on:
  push: { branches: [main] }
  pull_request:
# Every job reads only; none needs the token to write (ADR 0031).
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo build -p wyrm-core -p wyrm-link-api -p wyrm-link-guest -p wyrm-schedule --target wasm32-unknown-unknown
      - run: cargo build -p wyrm-link-scheduler --features wasm --lib --target wasm32-unknown-unknown
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
  audit:
    # RUSTSEC advisories against Cargo.lock; accepted ones are listed with reasons in .cargo/audit.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-audit }
      - run: cargo audit
  fixtures-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install cbor2
      - run: python spec/fixtures/gen.py --check
  dart-fixtures:
    # spec rule: every SDK must pass the CBOR fixture test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
        working-directory: dart/wyrm_core
      - run: dart analyze
        working-directory: dart/wyrm_core
      - run: dart test
        working-directory: dart/wyrm_core
  studio:
    # WYRM Studio (ADR 0037, docs/studio.md §9).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned in studio/pubspec.yaml (`environment.flutter`).
          flutter-version-file: studio/pubspec.yaml
          cache: true
      - name: Install frx
        # The installer pinned to the commit of tag v0.3.7.
        run: |
          curl -fsSL https://raw.githubusercontent.com/pro100andrey/flutter_redux_templates/d2bbfaedc6c9710468e8215a063f1430d16ba73a/tools/scripts/install.sh | sh -s -- --version 0.3.7 --no-modify-path
          echo "$HOME/.frx/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: dart run build_runner build --workspace
      - run: frx doctor
      - run: flutter analyze
      - name: Tests
        run: |
          for p in app ui business models storage localization; do
            if [ -d "$p/test" ]; then (cd "$p" && flutter test); fi
          done
