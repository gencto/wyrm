name: ci
on:
  push: { branches: [main] }
  pull_request:
# Every job reads only; none needs the token to write (ADR 0031).
permissions:
  contents: read
# A newer push to a pull request cancels the run it replaces: a stale run only
# holds runners and keeps showing "in progress" after its result is known.
# Runs on main are never cancelled, so every merged commit is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo build -p wyrm-core -p wyrm-link-api -p wyrm-link-guest -p wyrm-schedule -p wyrm-image --target wasm32-unknown-unknown
      - run: cargo build -p wyrm-link-scheduler --features wasm --lib --target wasm32-unknown-unknown
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # docs/rust-rules.md: C1–C10 and the baselined clippy lints, per file; counts only go down
      - run: python3 tool/check_rust_rules.py
      - name: The base of the change
        # tools/wyr/tests/boards.rs compares packaging/images/boards.json with it: the
        # root partition of a board never changes its size. The checkout has one commit,
        # so the base is fetched here; without it that test fails in CI.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git fetch -q --depth=1 origin "$BASE" 2>/dev/null &&
            git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "BOARDS_BASE=$BASE" >> "$GITHUB_ENV"
          else
            git fetch -q --depth=1 origin main:refs/remotes/origin/main
          fi
      - run: cargo test --workspace --all-features
  armv7:
    # 32-bit ARM (packaging/wyrmd/README.md): wyrmd must build for it on every pull request, and the
    # core, state and flow tests run on it as a Cortex-A7 under qemu-user. An instruction above
    # ARMv7 fails them; the flow math (libm) gives the digits the host gives. Release profile: a
    # debug rhai under emulation spends the 10 ms CPU limit of a script on translating new code.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      TARGET: armv7-unknown-linux-musleabihf
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_RUNNER: qemu-arm-static -cpu cortex-a7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: armv7-unknown-linux-musleabihf }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: armv7 }
      # zig is the linker and C compiler of the cross build, qemu-user runs it; pinned
      - run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-user-static
          python3 -m pip install --user --break-system-packages ziglang==0.17.1
          cargo install --locked cargo-zigbuild --version 0.24.1
      - run: cargo zigbuild --locked --release -p wyrmd --target "$TARGET"
      - run: qemu-arm-static -cpu cortex-a7 "target/$TARGET/release/wyrmd" release-info
      - run: cargo-zigbuild test --locked --release --no-fail-fast -p wyrm-core -p wyrm-state -p wyrm-flow --target "$TARGET"
  audit:
    # RUSTSEC advisories against Cargo.lock; accepted ones are listed with reasons in .cargo/audit.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: cargo-audit }
      - run: cargo audit
  openwrt-first-boot:
    # The first-boot script of the board images (ADR 0051 §4) under busybox, on regions
    # that `wyr image build` writes: busybox must unpack what the crate wyrm-image makes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Changed paths
        id: changed
        # Runs the job's work only when the script, the format or the tool changed.
        # When the base commit cannot be fetched, the work runs.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          run=true
          if git fetch -q --depth=1 origin "$BASE" 2>/dev/null &&
            files=$(git diff --name-only "$BASE" HEAD); then
            echo "$files" | grep -qE '^(packaging/openwrt/|packaging/images/|crates/wyrm-image/|tools/wyr/src/image|\.github/workflows/ci\.yml)' || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - if: steps.changed.outputs.run == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changed.outputs.run == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q busybox-static shellcheck
      - if: steps.changed.outputs.run == 'true'
        name: shellcheck
        run: |
          shellcheck -s sh packaging/openwrt/tests/*.sh \
            packaging/openwrt/wyrmd/files/usr/libexec/wyrm/*.sh \
            packaging/openwrt/wyrmd/files/etc/init.d/wyrmd \
            packaging/openwrt/wyrmd/files/etc/uci-defaults/* \
            packaging/openwrt/wyrmd/files/etc/hotplug.d/ntp/20-wyrm-time \
            packaging/images/*.sh tools/wyr/tests/vectors/make.sh
      - if: steps.changed.outputs.run == 'true'
        run: cargo build -p wyr
      - if: steps.changed.outputs.run == 'true'
        name: First boot under busybox
        run: SH="busybox sh" BB=busybox WYR="$PWD/target/debug/wyr" packaging/openwrt/tests/first_boot.sh
      - if: steps.changed.outputs.run == 'true'
        name: First boot under dash
        run: SH=dash WYR="$PWD/target/debug/wyr" packaging/openwrt/tests/first_boot.sh
      - if: steps.changed.outputs.run == 'true'
        name: Data partition and site rule under busybox and dash
        run: |
          SH="busybox sh" BB=busybox packaging/openwrt/tests/data_part.sh
          SH=dash packaging/openwrt/tests/data_part.sh
  fixtures-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install cbor2
      - run: python spec/fixtures/gen.py --check
  dart-fixtures:
    # spec rule: every SDK must pass the CBOR fixture test; and the Dart
    # packages, the typed decode boundary of every Dart client (Studio too).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        # the Dart of Studio's Flutter (studio/pubspec.yaml): the committed
        # `*.freezed.dart` files are formatted by it
        with: { sdk: 3.14.0 }
      - run: dart pub get
        working-directory: dart/wyrm_core
      - run: dart analyze --fatal-infos
        working-directory: dart/wyrm_core
      - run: dart test
        working-directory: dart/wyrm_core
      - run: dart pub get --enforce-lockfile
        working-directory: dart/wyrm_client
      - name: Generated models are current
        working-directory: dart/wyrm_client
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- . || { echo "run: dart run build_runner build (dart/wyrm_client) and commit"; exit 1; }
      - run: dart analyze --fatal-infos
        working-directory: dart/wyrm_client
      # `e2e` tests build crates with cargo (a gateway, the FFI library)
      - run: dart test -x e2e
        working-directory: dart/wyrm_client
      - run: dart pub get
        working-directory: dart/wyrm_ffi
      - run: dart analyze --fatal-infos
        working-directory: dart/wyrm_ffi
      - run: dart test -x e2e
        working-directory: dart/wyrm_ffi
  studio:
    # WYRM Studio (ADR 0037, docs/studio.md §9).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned in studio/pubspec.yaml (`environment.flutter`).
          flutter-version-file: studio/pubspec.yaml
          cache: true
      - name: Install frx
        # The installer pinned to the commit of tag v0.3.7.
        run: |
          curl -fsSL https://raw.githubusercontent.com/pro100andrey/flutter_redux_templates/d2bbfaedc6c9710468e8215a063f1430d16ba73a/tools/scripts/install.sh | sh -s -- --version 0.3.7 --no-modify-path
          echo "$HOME/.frx/bin" >> "$GITHUB_PATH"
      - name: Native libraries for nativeapi
        # window_manager and screen_retriever run on nativeapi, whose build
        # hook (`cnativeapi`) compiles its C++ core for the host on every
        # `flutter test` and links GTK 3, X11 and Xi through pkg-config.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - run: dart run build_runner build --workspace
      - run: frx doctor
      - run: dart run tool/check_rules.dart
      - run: flutter analyze
      - name: Tests
        run: |
          for p in app ui business models storage localization device_key; do
            if [ -d "$p/test" ]; then (cd "$p" && flutter test); fi
          done
  studio-goldens:
    # The goldens of ui/test/goldens are drawn and compared on macOS only (text
    # renders differently elsewhere; each golden test skips off macOS), so the
    # `studio` job on Linux never compares them. This job does.
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Pinned in studio/pubspec.yaml (`environment.flutter`).
          flutter-version-file: studio/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --workspace
      - name: Goldens
        working-directory: studio/ui
        # The runner's text anti-aliasing differs from a developer's Mac by at
        # most 0.34 % of a golden's pixels (measured 2026-11-15); see
        # studio/ui/test/flutter_test_config.dart. Locally goldens compare
        # exactly.
        env:
          GOLDEN_TOLERANCE: "0.005"
        run: flutter test test/goldens
      - name: Golden differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-failures
          path: studio/ui/test/goldens/failures/
          retention-days: 7
