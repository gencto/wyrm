name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build -p wyrm-core -p wyrm-link-api -p wyrm-link-guest -p wyrm-schedule --target wasm32-unknown-unknown
      - run: cargo build -p wyrm-link-scheduler --features wasm --lib --target wasm32-unknown-unknown
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
  audit:
    # RUSTSEC advisories against Cargo.lock; accepted ones are listed with reasons in .cargo/audit.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - run: cargo audit
  fixtures-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cbor2
      - run: python spec/fixtures/gen.py --check
  dart-fixtures:
    # spec rule: every SDK must pass the CBOR fixture test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
        working-directory: dart/wyrm_core
      - run: dart analyze
        working-directory: dart/wyrm_core
      - run: dart test
        working-directory: dart/wyrm_core
  studio:
    # WYRM Studio (ADR 0037, docs/studio.md §9). Informational until its first
    # green run on GitHub. Drop continue-on-error once it passes.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install frx
        run: |
          curl -fsSL https://raw.githubusercontent.com/pro100andrey/flutter_redux_templates/main/tools/scripts/install.sh | sh -s -- --version 0.3.7 --no-modify-path
          echo "$HOME/.frx/bin" >> "$GITHUB_PATH"
      - run: flutter pub get
      - run: dart run build_runner build --workspace
      - run: frx doctor
      - run: flutter analyze
      - name: Tests
        run: |
          for p in app ui business models storage localization; do
            if [ -d "$p/test" ]; then (cd "$p" && flutter test); fi
          done
