name: images-smoke
# The QEMU smoke test of the board images (ADR 0051, packaging/images/smoke.sh): the base
# image of `qemu-armsr` is built with OpenWrt's ImageBuilder, its gzip checked as the
# imagers read it (gzip-readers.sh, before the boot: one member, the size in its
# trailer, four readers), assembled with a test
# configuration and a setup code, booted twice, and the first admin made through the
# gateway. Runs on pull requests that change the package, the images, the format or the
# tool. A path filter leaves the check pending on other pull requests: do not make it a
# required check.
on:
  pull_request:
    paths:
      - "packaging/openwrt/**"
      - "packaging/images/**"
      - "crates/wyrm-image/**"
      - "tools/wyr/src/image*.rs"
      - ".github/workflows/images-smoke.yml"
  workflow_dispatch:
# Every job reads only (ADR 0031).
permissions:
  contents: read
concurrency:
  group: images-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
jobs:
  wyrmd:
    # The broker for the board: a static aarch64 musl release build (a debug build does
    # not fit the root partition), built on an arm64 host so it can say its version.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { targets: aarch64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: wyrmd-aarch64-musl }
      - name: musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release -p wyrmd --target aarch64-unknown-linux-musl
      - id: version
        run: |
          v="$(target/aarch64-unknown-linux-musl/release/wyrmd release-info | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyrmd-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/wyrmd
          retention-days: 1
          if-no-files-found: error

  smoke:
    # The ImageBuilder is published for x86-64 only, so the image is built here; the
    # aarch64 guest runs under TCG (no KVM for another architecture), slower than on an
    # arm64 host with KVM: smoke.sh gives a boot 900 s then, and a `cortex-a72` CPU (Ubuntu's
    # UEFI firmware stops after its banner on `max`). The QEMU output (`*.qemu`) is uploaded
    # with the console logs.
    needs: wyrmd
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: wyr }
      - name: QEMU, its UEFI firmware and bsdcat
        # bsdcat (libarchive) is one of the gzip readers smoke.sh runs; gunzip, python3 and
        # node are on the runner. gzip-readers.sh fails when a reader cannot run.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-arm qemu-efi-aarch64 libarchive-tools
          for r in gunzip bsdcat python3 node; do command -v "$r"; done
      - run: cargo build --locked -p wyr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wyrmd-aarch64-musl, path: bin }
      - name: Smoke test
        env:
          VERSION: ${{ needs.wyrmd.outputs.version }}
        run: |
          chmod +x bin/wyrmd
          packaging/images/smoke.sh --wyrmd bin/wyrmd --wyrmd-version "$VERSION" \
            --wyr target/debug/wyr --work "$RUNNER_TEMP/smoke"
      - name: Console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/*.qemu
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke/base/*.partitions.txt
            ${{ runner.temp }}/smoke/base/index.json
          retention-days: 7
          if-no-files-found: ignore
