name: images-smoke
# The QEMU smoke test of the board images (ADR 0051, packaging/images/smoke.sh): the base
# image of `qemu-armsr` is built with OpenWrt's ImageBuilder, its gzip checked as the
# imagers read it (gzip-readers.sh, before the boot: one member, the size in its
# trailer, four readers), assembled with a test
# configuration and a setup code, booted twice, and the first admin made through the
# gateway. Then the same base image is assembled by the image builder page's own code
# (site/assets/start.js and its WebAssembly, under Node: `smoke.sh --assembled`), its
# gzip checked by the same readers, and booted twice with the same checks. Runs on pull
# requests that change the package, the images, the format, the tool or the page. A path
# filter leaves the check pending on other pull requests: do not make it a required
# check.
on:
  pull_request:
    paths:
      - "packaging/openwrt/**"
      - "packaging/images/**"
      - "crates/wyrm-image/**"
      - "tools/wyr/src/image*.rs"
      - "crates/wyrm-image-web/**"
      - "site/assets/start.js"
      - "tool/site/test_start.mjs"
      - "tool/site/wasm.sh"
      - ".github/workflows/images-smoke.yml"
  workflow_dispatch:
# Every job reads only (ADR 0031).
permissions:
  contents: read
concurrency:
  group: images-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  # the `wasm-bindgen` CLI of the page's WebAssembly, as in site.yml
  WASM_BINDGEN_VERSION: 0.2.130
  WASM_BINDGEN_SHA256: 9687f3bb551b9f66f37ed32a40d7913a00f7962db653054e56857bc306c3227f
jobs:
  wyrmd:
    # The broker for the board: a static aarch64 musl release build (a debug build does
    # not fit the root partition), built on an arm64 host so it can say its version.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { targets: aarch64-unknown-linux-musl }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: wyrmd-aarch64-musl }
      - name: musl toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          echo "CC_aarch64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release -p wyrmd --target aarch64-unknown-linux-musl
      - id: version
        run: |
          v="$(target/aarch64-unknown-linux-musl/release/wyrmd release-info | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')"
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyrmd-aarch64-musl
          path: target/aarch64-unknown-linux-musl/release/wyrmd
          retention-days: 1
          if-no-files-found: error

  smoke:
    # The ImageBuilder is published for x86-64 only, so the image is built here; the
    # aarch64 guest runs under TCG (no KVM for another architecture), slower than on an
    # arm64 host with KVM: smoke.sh gives a boot 900 s then, and a `cortex-a72` CPU (Ubuntu's
    # UEFI firmware stops after its banner on `max`). The QEMU output (`*.qemu`) is uploaded
    # with the console logs. Four boots in all (two of each image), each up to 900 s.
    needs: wyrmd
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: wyr }
      - name: QEMU, its UEFI firmware and bsdcat
        # bsdcat (libarchive) is one of the gzip readers smoke.sh runs; gunzip, python3 and
        # node are on the runner. gzip-readers.sh fails when a reader cannot run.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-arm qemu-efi-aarch64 libarchive-tools
          for r in gunzip bsdcat python3 node; do command -v "$r"; done
      - run: cargo build --locked -p wyr
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wyrmd-aarch64-musl, path: bin }
      - name: Smoke test
        env:
          VERSION: ${{ needs.wyrmd.outputs.version }}
        run: |
          chmod +x bin/wyrmd
          packaging/images/smoke.sh --wyrmd bin/wyrmd --wyrmd-version "$VERSION" \
            --wyr target/debug/wyr --work "$RUNNER_TEMP/smoke"
      - name: The catalog of links
        run: python3 packaging/images/test_catalog.py
      - name: Install wasm-bindgen
        run: |
          d="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o wasm-bindgen.tar.gz \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${d}.tar.gz"
          echo "${WASM_BINDGEN_SHA256}  wasm-bindgen.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf wasm-bindgen.tar.gz -C "$RUNNER_TEMP" "$d/wasm-bindgen"
          mv "$RUNNER_TEMP/$d/wasm-bindgen" "$RUNNER_TEMP/bin/"
          rm wasm-bindgen.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # site/dist/assets/wasm, where smoke.sh --assembled looks for it
      - name: The image builder page's WebAssembly
        run: tool/site/wasm.sh
      - name: Smoke test of the image the page assembles
        run: |
          packaging/images/smoke.sh --base "$RUNNER_TEMP/smoke/base" \
            --assembled "$RUNNER_TEMP/smoke-page/wyrm-qemu-armsr-smoke.img.gz" \
            --wyr target/debug/wyr --work "$RUNNER_TEMP/smoke-page"
      - name: Console logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/*.qemu
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke-page/*.log
            ${{ runner.temp }}/smoke-page/*.qemu
            ${{ runner.temp }}/smoke-page/*.txt
            ${{ runner.temp }}/smoke-page/choices.json
            ${{ runner.temp }}/smoke/base/*.partitions.txt
            ${{ runner.temp }}/smoke/base/index.json
          retention-days: 7
          if-no-files-found: ignore
