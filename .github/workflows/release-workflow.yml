# Copy to .github/workflows/links-release.yml (a session without the GitHub `workflow` scope cannot add it).
# The official links release (ADR 0043): every link of links/official.json in every form it lists,
# packed by `wyr repo build`, indexed by `wyr repo index`, published as the assets of release <tag>;
# the index also replaces the one asset of release `links-index`, the URL brokers read
# (`packages.repository: "official"`). No link list lives here: the manifest is the one source.
#
#   git tag links-v2026.11.11 && git push origin links-v2026.11.11   # build and publish
#   Actions ▸ links-release ▸ Run workflow (publish off)                # build only: artifacts
name: links-release
on:
  push:
    tags: ["links-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (links-v…); empty: build only"
        required: false
        default: ""
permissions: {}
concurrency:
  group: links-release
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: never
jobs:
  check:
    # The manifest against the workspace (versions, names, kinds); the same check runs in ci.yml as a test.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: wyr }
      - run: cargo build --locked --release -p wyr
      - run: target/release/wyr repo check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: wyr-linux-x86_64, path: target/release/wyr, retention-days: 1 }

  wasm:
    # One component per link, the same file for every host.
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: wasm }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wyr-linux-x86_64, path: bin }
      - run: chmod +x bin/wyr && bin/wyr repo build --form wasm --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: links-wasm, path: dist/*.zip, if-no-files-found: error }

  process:
    # One binary per link and host. Linux builds are static (musl), so they run on any board;
    # `hosts` in links/official.json must list exactly these three.
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, host: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, host: linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, host: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { key: "${{ matrix.target }}" }
      - name: musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q musl-tools
          t=$(echo "${{ matrix.target }}" | tr '-' '_')
          echo "CC_${t}=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release -p wyr
      - run: target/release/wyr repo build --form process --target "${{ matrix.target }}" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "links-${{ matrix.host }}", path: dist/*.zip, if-no-files-found: error }

  publish:
    # The only job that writes: the release of the tag and the asset of release `links-index`.
    needs: [wasm, process]
    if: startsWith(github.ref, 'refs/tags/links-v') || startsWith(inputs.tag, 'links-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance (SLSA) for every package and the index: `gh attestation verify <zip> -R <repo>`.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: wyr-linux-x86_64, path: bin }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "links-*", path: dist, merge-multiple: true }
      - name: index
        # Every form and every host or nothing (no --partial); URLs point into release $TAG.
        run: |
          chmod +x bin/wyr
          bin/wyr repo index --zips dist --tag "$TAG" --out links-index.json
          cp links/official.json official.json
          (cd dist && sha256sum *.zip) > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            links-index.json
      - name: release of the tag
        run: |
          gh release create "$TAG" dist/*.zip links-index.json official.json SHA256SUMS \
            --verify-tag --latest=false --title "Official links $TAG" \
            --notes "Official link packages (ADR 0043). Brokers read the index through release links-index; this release keeps the files."
      - name: the index brokers read
        run: |
          gh release view links-index >/dev/null 2>&1 || \
            gh release create links-index --latest=false --title "Official links index" \
              --notes "The current links-index.json (ADR 0043). Packages are in the links-v* releases."
          gh release upload links-index links-index.json --clobber
