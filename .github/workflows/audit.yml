# New RUSTSEC advisories appear without a change in the code: check Cargo.lock every day too.
# The same check runs on every push in ci.yml (job `audit`); accepted advisories are in .cargo/audit.toml.
name: audit
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with: { tool: cargo-audit }
      - run: cargo audit
