# The documentation of the WYRM home site, https://wyrm.gencto.uk/docs/.
# `site/src/` is generated by `python3 tool/site/build.py`; see site/README.md.

[book]
title = "WYRM docs"
description = "WYRM: an industrial IoT broker on Eclipse Zenoh. Guides, links, architecture decisions and the protocol specification."
language = "en"
src = "src"

[build]
# The book is one part of the site: tool/site/build.py writes the rest of
# `dist/` (the designed pages, the assets, CNAME) before mdBook runs.
build-dir = "dist/docs"
# A SUMMARY entry without its file is an error, never an empty page.
create-missing = false

[output.html]
site-url = "/docs/"
# No `git-repository-url`: the top bar of the site has the link to GitHub, and
# the generator writes the pages, so editing them on GitHub would edit nothing.
no-section-label = true
# One look, the design's dark one: `theme/wyrm.css` gives every mdBook theme
# the same colours, and the theme menu is hidden.
default-theme = "coal"
preferred-dark-theme = "coal"
additional-css = ["theme/wyrm.css"]

# The decisions fold under "All decisions" in the side menu; the open page's
# branch is unfolded.
[output.html.fold]
enable = true
level = 0

# No "Run" button on Rust code: with it, mdBook's script asks
# play.rust-lang.org for its crate list on every page that shows Rust, and
# the site loads nothing from another host.
[output.html.playground]
runnable = false

[output.html.search]
enable = true
