# The WYRM home site, https://wyrm.gencto.uk.
# `site/src/` is generated by `python3 tool/site/build.py`; see site/README.md.

[book]
title = "WYRM"
description = "WYRM: an industrial IoT broker on Eclipse Zenoh. Guides, links, architecture decisions and the protocol specification."
language = "en"
src = "src"

[build]
build-dir = "book"
# A SUMMARY entry without its file is an error, never an empty page.
create-missing = false

[output.html]
site-url = "/"
git-repository-url = "https://github.com/gencto/wyrm"
# The generator writes the pages; editing them on GitHub would edit nothing.
no-section-label = true

[output.html.search]
enable = true
