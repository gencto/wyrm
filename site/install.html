<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install WYRM</title>
<meta name="description" content="Install WYRM: pick a way to run it, the links you need and a site name, and get wyrmd.json5, compose.yaml and the commands.">
<meta name="theme-color" content="#0E1113">
<meta property="og:title" content="Install WYRM">
<meta property="og:description" content="Install WYRM: pick a way to run it, the links you need and a site name, and get wyrmd.json5, compose.yaml and the commands.">
<meta property="og:url" content="https://wyrm.gencto.uk/install.html">
<link rel="canonical" href="https://wyrm.gencto.uk/install.html">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0E1113;color:#ECE9E1;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#6CC4B0;text-decoration:none}a:hover{color:#F3A766}
code,pre{font-family:'IBM Plex Mono',ui-monospace,monospace}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #6CC4B0;outline-offset:2px}
</style>
</head>
<body>
<template id="view">
<div style="background: #0E1113; color: #ECE9E1; min-height: 100vh; font-family: 'IBM Plex Sans', system-ui, sans-serif">

<!-- Top bar -->
<header style="border-bottom: 1px solid #252B30; background: #0E1113">
<nav aria-label="Main" style="max-width: 1200px; margin: 0 auto; padding: 18px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<a href="index.html" style="display: flex; align-items: center; gap: 12px; margin-right: auto; color: #ECE9E1">
<svg width="44" height="26" viewBox="0 0 44 26" aria-hidden="true"><circle cx="4" cy="17" r="3" fill="none" stroke="#E8893A" stroke-width="2"></circle><circle cx="13" cy="9" r="3.5" fill="none" stroke="#E8893A" stroke-width="2"></circle><circle cx="23" cy="6" r="4" fill="#E8893A"></circle><circle cx="33" cy="11" r="3.5" fill="none" stroke="#E8893A" stroke-width="2"></circle><circle cx="40" cy="20" r="3" fill="none" stroke="#E8893A" stroke-width="2"></circle></svg>
<span style="font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.08em">WYRM</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #8E979C">/ install</span>
</a>
<a href="index.html" style="font-size: 15px; color: #A3ABAF; padding: 10px 0">Home</a>
<a href="wiki.html" style="font-size: 15px; color: #A3ABAF; padding: 10px 0">Wiki</a>
<a href="#studio" style="font-size: 15px; color: #A3ABAF; padding: 10px 0">Studio</a>
<a href="https://github.com/gencto/wyrm/releases" style="display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; padding: 10px 16px; border: 1px solid #3A4249; border-radius: 8px; color: #ECE9E1">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"></path><polyline points="7 10 12 15 17 10"></polyline><path d="M5 21h14"></path></svg>
Releases
</a>
</nav>
</header>

<!-- Title -->
<section id="top" style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 32px; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; color: #E8893A">Install</p>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: clamp(34px, 4.6vw, 56px); line-height: 1.08; max-width: 900px">Put a broker on your site</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #C5CBCE; max-width: 780px">Pick where the broker runs and which links go in. This page gives you the file, the image or the compose file, a <code>wyrmd.json5</code> for your site and the commands to start it. Each path says plainly whether it works today or is still planned.</p>
</section>

<!-- Three deliveries -->
<section aria-label="What ships" style="max-width: 1200px; margin: 0 auto; padding: 0 24px 40px">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 16px">
<li style="flex: 1 1 300px; min-width: 0; padding: 22px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #E8893A">one per site</span>
<h2 style="margin: 0; font-size: 19px; font-weight: 600">The broker</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #C5CBCE"><code>wyrmd</code> with its historian, storage, flows, gateway and the links you pick. Steps 1 to 3 below.</p>
</li>
<li style="flex: 1 1 300px; min-width: 0; padding: 22px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6CC4B0">any time, published today</span>
<h2 style="margin: 0; font-size: 19px; font-weight: 600">Links</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #C5CBCE">25 official links in release <a href="https://github.com/gencto/wyrm/releases/tag/links-v2026.11.12">links-v2026.11.12</a>. A running broker installs more from Studio, checked by SHA-256.</p>
</li>
<li style="flex: 1 1 300px; min-width: 0; padding: 22px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #A3ABAF">one per person</span>
<h2 style="margin: 0; font-size: 19px; font-weight: 600">Studio</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #C5CBCE">The desktop app. It is not in the broker: one Studio logs in to a gateway and works on every site below it. <a href="#studio">Get Studio</a></p>
</li>
</ul>
</section>

<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px 96px; display: flex; flex-direction: column; gap: 72px">

<!-- 1 Where it runs -->
<section id="where" style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid #252B30"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #E8893A">1</span><h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15">Where it runs</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px">
<template data-for="paths" data-as="p">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="text-align: left; min-height: 168px; padding: 20px; border-radius: 12px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: #ECE9E1; display: flex; flex-direction: column; gap: 10px">
<template data-if="p.isImage"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8893A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="9" width="12" height="13" rx="2"></rect><path d="M9 9V3h6v6"></path><path d="M10 5h1M13 5h1"></path></svg></template>
<template data-if="p.isArchive"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8893A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1"></rect><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9"></path><path d="M10 13h4"></path></svg></template>
<template data-if="p.isDocker"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8893A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="8" rx="1.5"></rect><rect x="5" y="7" width="4" height="4"></rect><rect x="10" y="7" width="4" height="4"></rect><rect x="10" y="3" width="4" height="4"></rect><rect x="15" y="7" width="4" height="4"></rect></svg></template>
<template data-if="p.isSource"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8893A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg></template>
<span style="font-size: 18px; font-weight: 600">{{p.t}}</span>
<span style="font-size: 14px; line-height: 1.5; color: #A3ABAF">{{p.s}}</span>
<span style="margin-top: auto; align-self: flex-start; padding: 3px 10px; border-radius: 999px; border: 1px solid {{p.stb}}; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{p.stc}}">{{p.st}}</span>
</button>
</template>
</div>
<div role="group" aria-label="Target" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8E979C; margin-right: 6px">target</span>
<template data-for="targets" data-as="t">
<button type="button" aria-pressed="{{t.pressed}}" disabled="{{t.off}}" onClick="{{t.pick}}" style="min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: {{t.color}}; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left">
<span style="font-size: 14px; font-weight: 600">{{t.t}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E979C">{{t.s}}</span>
</button>
</template>
</div>
</section>

<!-- 2 What goes in -->
<section id="contents" style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid #252B30"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #E8893A">2</span><h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15">What goes in</h2></div>
<p style="margin: 0; font-size: 16px; line-height: 1.7; color: #C5CBCE; max-width: 820px">Every broker has its historian, storage, flow engine and gateway. Start from a set and change it, or pick links one by one. A link you leave out can be installed later from Studio while the broker runs.</p>
<div role="group" aria-label="Starting set" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8E979C; margin-right: 6px">set</span>
<template data-for="presets" data-as="p">
<button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.pick}}" style="min-height: 44px; padding: 8px 18px; border-radius: 999px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: #ECE9E1; font-size: 14px; font-weight: 500">{{p.t}}</button>
</template>
</div>
<div role="group" aria-label="How links run" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px">
<template data-for="modes" data-as="m">
<button type="button" aria-pressed="{{m.pressed}}" onClick="{{m.pick}}" style="text-align: left; min-height: 64px; padding: 14px 18px; border-radius: 10px; border: 1px solid {{m.border}}; background: {{m.bg}}; color: #ECE9E1; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 15px; font-weight: 600">{{m.t}}</span>
<span style="font-size: 13px; line-height: 1.5; color: #A3ABAF">{{m.s}}</span>
</button>
</template>
</div>
<div style="display: flex; flex-direction: column; gap: 22px">
<template data-for="groups" data-as="g">
<div role="group" aria-label="{{g.t}}" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #8E979C">{{g.t}}</span>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px">
<template data-for="g.items" data-as="l">
<button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" style="text-align: left; min-height: 76px; padding: 12px 14px; border-radius: 10px; border: 1px solid {{l.border}}; background: {{l.bg}}; color: #ECE9E1; display: flex; gap: 12px; align-items: flex-start">
<span aria-hidden="true" style="flex: 0 0 auto; width: 16px; height: 16px; margin-top: 3px; border-radius: 4px; border: 1.5px solid {{l.markBorder}}; background: {{l.mark}}"></span>
<span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 15px; font-weight: 600">{{l.t}}</span>
<span style="font-size: 13px; line-height: 1.45; color: #A3ABAF">{{l.s}}</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E979C">{{l.form}} · {{l.size}}</span>
</span>
</button>
</template>
</div>
</div>
</template>
</div>
</section>

<!-- 3 Your site -->
<section id="site" style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid #252B30"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #E8893A">3</span><h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15">Your site</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px 40px; align-items: flex-start">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="site-name" style="font-size: 15px; font-weight: 600">Site name</label>
<input id="site-name" type="text" value="{{siteValue}}" onChange="{{onSite}}" autocomplete="off" spellcheck="false" style="box-sizing: border-box; width: 100%; max-width: 360px; height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid #3A4249; background: #161A1D; color: #ECE9E1; font-family: 'IBM Plex Mono', monospace; font-size: 16px">
<template data-if="siteGood"><span style="font-size: 13px; line-height: 1.5; color: #8E979C">Every key of this broker starts with <code>wy/{{site}}/</code>. Lowercase letters, digits and hyphens.</span></template>
<template data-if="siteBad"><span role="alert" style="font-size: 13px; line-height: 1.5; color: #F3A766">Use lowercase letters, digits and hyphens, starting with a letter. The files below use “plant” until then.</span></template>
</div>
<div style="flex: 1 1 420px; min-width: 0; padding: 18px 20px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 600">No secret goes into a file</span>
<span style="font-size: 14px; line-height: 1.6; color: #A3ABAF">The gateway's first admin password comes from <code>WYRM_GATEWAY_ADMIN_PASSWORD</code> at the first start, never from a file this page makes. Device credentials are entered in Studio and sealed by each link. A site above is joined later from Studio, Sites.</span>
</div>
</div>
</section>

<!-- 4 What you get -->
<section id="get" style="display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 10px; padding-bottom: 18px; border-bottom: 1px solid #252B30"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #E8893A">4</span><h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 30px; line-height: 1.15">What you get</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; padding: 14px 18px; border-radius: 12px; border: 1px solid {{statusBorder}}; background: #161A1D">
<span style="padding: 3px 10px; border-radius: 999px; border: 1px solid {{statusBorder}}; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{statusColor}}">{{statusText}}</span>
<span style="flex: 1 1 400px; min-width: 0; font-size: 14px; line-height: 1.6; color: #C5CBCE">{{note}}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<!-- summary -->
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div style="padding: 20px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8E979C">file</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; word-break: break-all">{{file}}</span>
<span style="font-size: 14px; line-height: 1.6; color: #A3ABAF">Site <code>{{site}}</code> · {{count}}: {{summary}}</span>
<template data-if="hasSize">
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<caption style="text-align: left; padding-bottom: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E979C">size, compressed; links from the release files</caption>
<tbody>
<template data-for="sizeRows" data-as="r">
<tr style="border-top: 1px solid #252B30"><th scope="row" style="padding: 8px 0; text-align: left; font-weight: 400; color: #C5CBCE">{{r.k}}</th><td style="padding: 8px 0; text-align: right; font-family: 'IBM Plex Mono', monospace; color: #ECE9E1">{{r.v}}</td></tr>
</template>
</tbody>
</table>
</template>
</div>
<template data-if="hasToday">
<div style="padding: 20px; border-radius: 12px; background: #161A1D; border: 1px solid #2F5A51; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600">Your link files, published today</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
<template data-for="today" data-as="f">
<li style="display: flex; justify-content: space-between; gap: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 13px"><a href="{{f.url}}" style="word-break: break-all">{{f.name}}</a><span style="color: #8E979C; white-space: nowrap">{{f.size}}</span></li>
</template>
</ul>
<span style="font-size: 13px; line-height: 1.5; color: #8E979C">Each one is in SHA256SUMS of the release and has build provenance.</span>
</div>
</template>
</div>

<!-- the files and commands -->
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<template data-if="isImage">
<div style="padding: 20px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 16px; font-weight: 600">Build the image in this browser</span>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px">
<template data-for="imgSteps" data-as="s">
<li style="padding: 14px; border-radius: 10px; border: 1px solid #2A3136; background: #0E1113; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #E8893A">{{s.n}}</span><span style="font-size: 14px; font-weight: 600">{{s.t}}</span><span style="font-size: 13px; line-height: 1.45; color: #A3ABAF">{{s.s}}</span></li>
</template>
</ol>
<span style="font-size: 13px; line-height: 1.6; color: #8E979C">The image is put together here from the release's base image, your <code>wyrmd.json5</code> and your packages. Nothing you choose is uploaded.</span>
<template data-if="notBuilt">
<button type="button" onClick="{{build}}" style="align-self: flex-start; min-height: 46px; padding: 0 22px; border-radius: 10px; border: 1px solid #E8893A; background: #E8893A; color: #0E1113; font-size: 15px; font-weight: 600">Build {{file}}</button>
</template>
<template data-if="built">
<div style="padding: 16px; border-radius: 10px; border: 1px solid #2F5A51; background: #0E1113; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600; color: #6CC4B0">Ready: {{file}}</span>
<span style="font-size: 14px; line-height: 1.6; color: #C5CBCE">Flash it, put it in the board and power on. The broker starts as site <code>{{site}}</code>, makes its CA and asks for the admin password on its console the first time.</span>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<a href="https://github.com/gencto/wyrm/releases" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #E8893A; color: #0E1113; font-size: 15px; font-weight: 600">Save the image</a>
<button type="button" onClick="{{rebuild}}" style="min-height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid #3A4249; background: transparent; color: #ECE9E1; font-size: 15px">Change and build again</button>
</div>
</div>
</template>
</div>
</template>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8E979C">commands</span>
<pre style="margin: 0; padding: 18px 20px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; font-size: 13px; line-height: 1.7; color: #C5CBCE; overflow-x: auto; white-space: pre">{{commands}}</pre>
</div>

<template data-if="isDocker">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8E979C">compose.yaml</span>
<pre style="margin: 0; max-height: 520px; overflow: auto; padding: 18px 20px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; font-size: 13px; line-height: 1.6; color: #C5CBCE; white-space: pre">{{compose}}</pre>
</div>
</template>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8E979C">wyrmd.json5</span>
<pre style="margin: 0; max-height: 520px; overflow: auto; padding: 18px 20px; border-radius: 12px; background: #161A1D; border: 1px solid #252B30; font-size: 13px; line-height: 1.6; color: #C5CBCE; white-space: pre">{{config}}</pre>
</div>
</div>
</div>
</section>

<!-- Studio -->

Y.push('      - ./wyrmd.json5:/etc/wyrm/wyrmd.json5:ro');
Y.push('    restart: unless-stopped');
if (conts.length) {
Y.push('');
Y.push('  # hands each link only its own certificate, key and token');
Y.push('  provision:');
Y.push('    image: alpine:3.22');
Y.push('    volumes: [wyrm-data:/wyrm:ro, link-files:/out]');
Y.push('    environment: { LINKS: "' + links + '" }');
Y.push('    command:');
Y.push('      - sh');
Y.push('      - -euc');
Y.push('      - |');
Y.push('        for id in $$LINKS; do');
Y.push('          d=/wyrm/links/$$id');
Y.push('          for i in $$(seq 120); do');
Y.push('            [ -s /wyrm/pki/ca.pem ] && [ -s $$d/token ] && [ -s $$d/link.key ] && break');
Y.push('            sleep 1');
Y.push('          done');
Y.push('          mkdir -p /out/$$id');
Y.push('          cp /wyrm/pki/ca.pem $$d/link.pem $$d/link.key $$d/token /out/$$id/');
Y.push('          chown -R 65532:65532 /out/$$id');
Y.push('          chmod 0400 /out/$$id/link.key /out/$$id/token');
Y.push('        done');
Y.push('    depends_on: [wyrmd]');
Y.push('    network_mode: none');
conts.forEach((l) => {
Y.push('');
Y.push('  link-' + l.id + ':');
Y.push('    <<: *hardened');
Y.push('    image: wyrm/link-' + l.id + ':local');
Y.push('    build: { <<: *build, target: link, args: { LINKS: "' + links + '", SIMS: "", LINK: ' + l.id + ' } }');
Y.push('    platform: ' + plat);
Y.push('    environment: { <<: *link-env, WYRM_LINK_ID: ' + l.id + ' }');
Y.push('    volumes:');
Y.push('      - { type: volume, source: link-files, target: /link, read_only: true, volume: { subpath: ' + l.id + ' } }');
Y.push('      - ' + l.id + '-state:/state');
Y.push('    depends_on:');
Y.push('      provision: { condition: service_completed_successfully }');
Y.push('    restart: unless-stopped');
});
}
Y.push('');
Y.push('  # wyr and wyrm-agent beside the gateway: docker compose run --rm tools');
Y.push('  tools:');
Y.push('    image: wyrm/tools:local');
Y.push('    build: { <<: *build, target: tools }');
Y.push('    network_mode: service:wyrmd');
Y.push('    environment:');
Y.push('      WYR_GATEWAY_PASSWORD: ${WYRM_GATEWAY_ADMIN_PASSWORD:?set the gateway admin password}');
Y.push('    profiles: [tools]');
Y.push('    stdin_open: true');
Y.push('    tty: true');
Y.push('');
Y.push('volumes:');
Y.push('  wyrm-data:');
if (conts.length) {
Y.push('  link-files:');
conts.forEach((l) => Y.push('  ' + l.id + '-state:'));
}
}
const compose = Y.join('\n');

// ---- file name, size, commands ----
const BROKER = 26.6;
const linksMb = sel.reduce((a, l) => a + (l.f.mb || 0), 0);
let file = '', commands = '', note = '', status = '';
const arch = host ? host : '';
if (path === 'image') {
file = 'wyrm-' + D.V + '-' + tgt.file + '.img.xz';
commands = [
'# Raspberry Pi Imager: Choose OS ▸ Use custom ▸ ' + file,
'# balenaEtcher: Flash from file ▸ ' + file,
'# or from a shell (replace sdX with your card; check it with lsblk first):',
'xz -dc ' + file + ' | sudo dd of=/dev/sdX bs=4M conv=fsync status=progress',
].join('\n');
note = 'Planned. No image is published yet: this panel shows the flow the page will run.';
status = 'planned';
} else if (path === 'archive') {
const ext = host === 'macos-aarch64' ? '.tar.gz' : '.tar.gz';
file = 'wyrm-' + D.V + '-' + arch + ext;
commands = [
'# 1. Download and check where it was built',
'curl -fLO https://github.com/gencto/wyrm/releases/download/wyrmd-v' + D.V + '/' + file,
'gh attestation verify ' + file + ' -R gencto/wyrm',
'',
'# 2. Unpack and start',
'tar xzf ' + file + ' && cd wyrm-' + D.V,
"export WYRM_GATEWAY_ADMIN_PASSWORD='<a password>'",
'./wyrmd -c wyrmd.json5',
].join('\n');
note = 'Planned for the broker. The link files are published today: their direct links below work now.';
status = 'planned';
} else if (path === 'docker') {
file = 'compose.yaml + wyrmd.json5';
commands = [
'git clone https://github.com/gencto/wyrm && cd wyrm',
'# save compose.yaml and wyrmd.json5 from this page here',
"export WYRM_GATEWAY_ADMIN_PASSWORD='<a password>'",
'docker compose up -d --build',
'docker compose run --rm tools      # wyr and wyrm-agent',
].join('\n');
note = 'Works today: the images are built from the repository. Built alone, the broker and every link take about 90 min on 2 jobs; this file builds only the links you picked. Published images are planned.';
status = 'source';
} else {
file = 'wyrmd.json5';
commands = [
'git clone https://github.com/gencto/wyrm && cd wyrm',
'cargo build --release -p wyrmd -p wyr',
'# save wyrmd.json5 from this page here',
"export WYRM_GATEWAY_ADMIN_PASSWORD='<a password>'",
'target/release/wyrmd -c wyrmd.json5',
].join('\n');
note = 'Works today on Linux and macOS. Links that are packages install from Studio once the broker runs.';
status = 'available';
}
const sizeRows = [];
if (path !== 'source') {
sizeRows.push({ k: docker ? 'wyrm/wyrmd image' : 'wyrmd and wyr', v: '≈ ' + fmt(BROKER) });
if (docker) sizeRows.push({ k: conts.length + ' link image' + (conts.length === 1 ? '' : 's'), v: fmt(conts.reduce((a, l) => a + l.f.mb, 0)) });
const pk = pkgs.reduce((a, l) => a + l.f.mb, 0);
sizeRows.push({ k: pkgs.length + ' package' + (pkgs.length === 1 ? '' : 's') + (docker ? ', from the repository' : ''), v: fmt(pk) });
if (path === 'image') sizeRows.push({ k: 'base system for the board', v: '[at release]' });
sizeRows.push({ k: 'WYRM in all', v: '≈ ' + fmt(BROKER + linksMb), strong: true });
}

// ---- view models ----
const SC = {
available: { t: 'Available', c: '#6CC4B0', b: '#2F5A51' },
source: { t: 'From source today', c: accent, b: '#5A4330' },
planned: { t: 'Planned', c: '#A3ABAF', b: '#3A4249' },
};
const paths = D.PATHS.map((p) => {
const on = p.id === path;
return { t: p.t, s: p.s, st: SC[p.st].t, stc: SC[p.st].c, stb: SC[p.st].b, pressed: on ? 'true' : 'false',
border: on ? accent : '#2A3136', bg: on ? '#1B2025' : '#161A1D', isImage: p.id === 'image', isArchive: p.id === 'archive', isDocker: p.id === 'docker', isSource: p.id === 'source',
pick: () => set({ path: p.id, target: D.TARGETS[p.id].find((t) => !t.off).id }) };
});
const tg = targets.map((t) => {
const on = t.id === tgt.id;
return { t: t.t, s: t.s, off: !!t.off, pressed: on ? 'true' : 'false', border: on ? accent : '#2A3136', bg: on ? '#1B2025' : 'transparent', color: t.off ? '#5E676C' : '#ECE9E1', pick: () => { if (!t.off) set({ target: t.id }); } };
});
const presets = D.PRESETS.concat([{ id: 'custom', t: 'Custom' }]).map((p) => {
const on = st.picked ? p.id === 'custom' : p.id === st.preset;
return { t: p.t, pressed: on ? 'true' : 'false', border: on ? accent : '#2A3136', bg: on ? '#1B2025' : 'transparent',
pick: () => (p.id === 'custom' ? set({ picked: picked.slice() }) : set({ preset: p.id, picked: null })) };
});
const modes = [{ id: 'inside', t: 'Inside the broker', s: 'Built-in drivers and WASM: one process, the smallest footprint' }, { id: 'separate', t: 'Separate processes', s: docker ? 'Equipment and file links in their own containers' : 'Each link supervised by the broker, restarted on its own' }].map((m) => {
const on = m.id === st.mode;
return { t: m.t, s: m.s, pressed: on ? 'true' : 'false', border: on ? accent : '#2A3136', bg: on ? '#1B2025' : 'transparent', pick: () => set({ mode: m.id }) };
});
const cats = ['Equipment', 'File stores', 'History sync', 'Apps', 'Messaging', 'Test'];
const groups = cats.map((c) => ({
t: c,
items: D.LINKS.filter((l) => l.c === c).map((l) => {
const on = isSel(l.id);
const f = form(l);
return { t: l.t, s: l.s, pressed: on ? 'true' : 'false', border: on ? accent : '#2A3136', bg: on ? '#1B2025' : '#161A1D',
mark: on ? accent : 'transparent', markBorder: on ? accent : '#4A535A', form: f.t, size: f.mb ? fmt(f.mb) : (host || !(l.w || l.p) || f.k === 'builtin' || f.k === 'process' ? '0 MB extra' : 'from the release'),
pick: () => { const cur = picked.slice(); const i = cur.indexOf(l.id); if (i >= 0) cur.splice(i, 1); else cur.push(l.id); set({ picked: cur }); } };
}),
}));
const today = pkgs.filter((l) => l.f.k === 'wasm' || host).map((l) => ({ name: pkgFile(l), url: D.REL + pkgFile(l), size: fmt(l.f.mb) }));
const summary = sel.length ? sel.map((l) => l.t + ' · ' + l.f.t).join(', ') : 'No links: the broker with its historian, storage, flows and gateway.';
const imgSteps = [
{ n: '1', t: 'Base system', s: 'The release image for ' + tgt.t + ', fetched once' },
{ n: '2', t: 'Your broker', s: 'wyrmd ' + D.V + ' and wyrmd.json5 for site ' + site },
{ n: '3', t: 'Your links', s: pkgs.length ? pkgs.length + ' package' + (pkgs.length === 1 ? '' : 's') + ' from links-v2026.11.12' : 'Built-in drivers only' },
{ n: '4', t: 'Download', s: file + ', checked by SHA-256' },
];
return {
accent, paths, targets: tg, presets, modes, groups, today, hasToday: today.length > 0, summary, imgSteps,
isImage: path === 'image', isArchive: path === 'archive', isDocker: docker, isSource: path === 'source', notImage: path !== 'image',
config, compose, commands, file, note, sizeRows, hasSize: sizeRows.length > 0,
statusText: SC[status].t, statusColor: SC[status].c, statusBorder: SC[status].b,
count: sel.length + (sel.length === 1 ? ' link' : ' links'), siteValue: st.site, siteBad: !siteOk, siteGood: siteOk, site,
built: st.built, notBuilt: !st.built,
onSite: (e) => this.setState({ site: e.target.value.trim().toLowerCase(), built: false }),
build: () => this.setState({ built: true }),
rebuild: () => this.setState({ built: false }),
};
}
}
DC.mount(Component, { accent: "#E8893A" });
</script>
</body>
</html>
