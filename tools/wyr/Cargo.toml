[package]
name = "wyr"
description = "WYRM CLI: list, tree, sub, set, invoke, meta, resolve, flow, bench, keygen, admin and dev commands (new, dev, sim, record, replay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
zeroize.workspace = true
wyrm-core.workspace = true
wyrm-flow.workspace = true
wyrm-client = { workspace = true, features = ["advanced"] }
wyrm-history.workspace = true
zenoh = { workspace = true, features = ["transport_tcp", "transport_tls", "transport_unixsock-stream"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "signal"] }
clap = { workspace = true, features = ["env"] }
hex.workspace = true
ed25519-dalek.workspace = true
base64.workspace = true
getrandom.workspace = true
serde_json.workspace = true
json5.workspace = true
wyrm-link-sdk.workspace = true
wyrm-link-mock.workspace = true
minicbor.workspace = true

[dev-dependencies]
wyrm-link-sdk = { workspace = true, features = ["harness"] }
