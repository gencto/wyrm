[package]
name = "wyrm-link-mock"
description = "WYRM mock connector: N points x F Hz on a configurable tree, for tests and benchmarks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
bin = ["dep:clap", "dep:hex", "dep:tracing-subscriber", "zenoh/transport_tcp", "zenoh/transport_unixsock-stream", "tokio/rt-multi-thread", "tokio/signal"]
# The framework mock (mockdev) as a package binary (ADR 0021).
process = ["wyrm-link-sdk/process"]

[[bin]]
name = "wyrm-link-mock"
required-features = ["bin"]

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
zenoh.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tracing.workspace = true
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[dev-dependencies]
wyrm-link-sdk = { workspace = true, features = ["harness"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[[bin]]
name = "wyrm-link-mockdev"
required-features = ["process"]

# The package (ADR 0021): `wyr link pack`; the framework mock, not the
# bench connector `wyrm-link-mock`.
[package.metadata.wyrm-link]
name = "mockdev"
description = "Simulated devices on the driver framework: connections, devices and points from its own Add actions"
bin = "wyrm-link-mockdev"
features = ["process"]
