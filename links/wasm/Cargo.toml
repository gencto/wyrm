[package]
name = "wyrm-link-wasm"
description = "WYRM wasm driver: link points read and written by a WebAssembly component with a TCP allowlist (ADR 0011, ADR 0012)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
wyrm-wasm-host.workspace = true
wyrm-link-api.workspace = true
wyrm-link-portable.workspace = true
minicbor.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
wyrm-link-sdk = { workspace = true, features = ["harness"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
wat.workspace = true
ed25519-dalek.workspace = true
wit-component.workspace = true
# a TLS server for the app's `tls` action (ADR 0030): ring only, never aws-lc
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pki-types = { workspace = true, features = ["std"] }
rcgen.workspace = true
