[package]
name = "wyrm-link-prometheus"
description = "WYRM Prometheus / OpenMetrics scrape connector on the driver framework (ADR 0004)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# In-process exporter simulator for tests and demos.
sim = []
bin = ["sim", "dep:clap", "tokio/rt-multi-thread", "tokio/signal"]
# The link as a package binary (ADR 0021).
process = ["wyrm-link-sdk/process"]

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "net", "io-util"] }
tracing.workspace = true
# HTTP/1.1 client: plain hyper over tokio-rustls with the ring provider.
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util.workspace = true
bytes.workspace = true
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
rustls-native-certs.workspace = true
base64.workspace = true
# gzip response bodies.
flate2.workspace = true
# Label matchers =~ and !~.
regex.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
wyrm-link-prometheus = { path = ".", features = ["sim"] }
wyrm-link-sdk = { workspace = true, features = ["harness"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
rcgen.workspace = true

[[bin]]
name = "wyrm-prometheus-sim"
required-features = ["bin"]

[[bin]]
name = "wyrm-link-prometheus"
required-features = ["process"]

# The package (ADR 0021): `wyr link pack`.
[package.metadata.wyrm-link]
name = "prometheus"
description = "Prometheus / OpenMetrics scrape: series selectors as points (aggregates, rates, histogram quantiles)"
bin = "wyrm-link-prometheus"
features = ["process"]
