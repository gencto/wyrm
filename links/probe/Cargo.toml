[package]
name = "wyrm-link-probe"
description = "WYRM probe: runs test scenarios against a broker through its user gateway (actions, node callbacks, values) and reports each step"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
bin = ["wyrm-link-sdk/process", "dep:tracing-subscriber", "tokio/rt-multi-thread"]

[[bin]]
name = "wyrm-link-probe"
path = "src/main.rs"
required-features = ["bin"]

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
wyrm-gateway-client.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
