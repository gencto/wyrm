[package]
name = "wyrm-link-modbus"
description = "WYRM Modbus TCP connector on tokio-modbus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# In-process Modbus TCP simulator for tests and demos (`diagslave` stand-in).
sim = ["tokio-modbus/tcp-server", "tokio-modbus/rtu-over-tcp-server"]
bin = ["sim", "dep:clap", "tokio/rt-multi-thread", "tokio/signal"]
# The link as a package binary (ADR 0021).
process = ["wyrm-link-sdk/process"]

[[bin]]
name = "wyrm-modbus-sim"
required-features = ["bin"]

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync", "net"] }
# Slave mode (ADR 0024) serves Modbus TCP and RTU.
tokio-modbus = { workspace = true, features = ["tcp", "rtu", "tcp-server", "rtu-server"] }
# Serial RTU; no libudev (port listing reads sysfs on Linux).
tokio-serial = { version = "5.4", default-features = false }
tracing.workspace = true
thiserror.workspace = true
# `import_dsa` reads a DSA `nodes.json` (a user file, not the wire codec).
serde_json.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
wyrm-link-modbus = { path = ".", features = ["sim"] }
wyrm-link-sdk = { workspace = true, features = ["harness"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
# A master against the slave kinds; a log capture for the warning test.
tokio-modbus = { workspace = true, features = ["tcp", "rtu"] }
tracing-subscriber.workspace = true

[[bin]]
name = "wyrm-link-modbus"
required-features = ["process"]

# The package (ADR 0021): `wyr link pack`.
[package.metadata.wyrm-link]
name = "modbus"
description = "Modbus TCP and RTU (over TCP or serial) devices: FC1-4 batched reads, FC5/6/15/16/22 writes"
bin = "wyrm-link-modbus"
features = ["process"]
