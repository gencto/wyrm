[package]
name = "wyrm-link-mysql"
description = "WYRM history sync to MySQL and MariaDB (ADR 0026): a portable App that writes a history sink's batches into a table"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# cdylib: the WASM component (`--features wasm`, wasm32-unknown-unknown);
# rlib: the process binary and the tests
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wyrm-link-mysql"
required-features = ["process"]

[features]
process = ["dep:wyrm-link-sdk", "wyrm-link-sdk/process", "dep:wyrm-link-portable"]
wasm = ["dep:wyrm-link-guest"]

[dependencies]
# Only these build for wasm32-unknown-unknown: keep the others optional.
wyrm-core.workspace = true
wyrm-link-api.workspace = true
wyrm-history-sync.workspace = true
# mysql_native_password (SHA-1) and caching_sha2_password (SHA-256); pure Rust, wasm32
sha1.workspace = true
sha2.workspace = true
wyrm-link-guest = { workspace = true, optional = true }
wyrm-link-sdk = { workspace = true, optional = true }
wyrm-link-portable = { workspace = true, optional = true }

[dev-dependencies]
wyrm-link-portable.workspace = true
wyrm-history-sync = { workspace = true, features = ["testkit"] }

# `wyr link pack` (ADR 0021, 0023): a WASM package; the same code packs as a
# process with `--kind process`. The password goes in with Set Password.
[package.metadata.wyrm-link]
name = "mysql"
description = "History sync to MySQL and MariaDB (ADR 0026)"
kind = "wasm"
features = ["process"]
capabilities = { store_mb = 1 }
