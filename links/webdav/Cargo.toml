[package]
name = "wyrm-link-webdav"
description = "WYRM WebDAV link: Nextcloud, ownCloud, Synology, SharePoint-style DAV folders as a tree, folders, uploads, downloads"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# In-process WebDAV server (class 1) for tests and demos.
sim = ["wyrm-filestore/sim"]
bin = ["sim", "dep:clap", "tokio/rt-multi-thread", "tokio/signal"]
# The link as a package binary (ADR 0021).
process = ["wyrm-link-sdk/process"]

[[bin]]
name = "wyrm-webdav-sim"
required-features = ["bin"]

[[bin]]
name = "wyrm-link-webdav"
required-features = ["process"]

[dependencies]
wyrm-core.workspace = true
wyrm-link-sdk.workspace = true
wyrm-filestore.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "sync"] }
tracing.workspace = true
hyper = { workspace = true }
bytes.workspace = true
base64.workspace = true
zeroize.workspace = true
clap = { workspace = true, optional = true }

[dev-dependencies]
wyrm-link-webdav = { path = ".", features = ["sim"] }
wyrm-link-sdk = { workspace = true, features = ["harness"] }
wyrm-filestore = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# The package (ADR 0021): `wyr link pack`.
[package.metadata.wyrm-link]
name = "webdav"
description = "WebDAV (Nextcloud, ownCloud, Synology, …): a folder as a tree, folders, uploads, downloads"
bin = "wyrm-link-webdav"
features = ["process"]
